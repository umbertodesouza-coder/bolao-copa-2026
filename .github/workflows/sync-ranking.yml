name: Ranking Consolidado - Copa 2026
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Calcular ranking
        run: node scripts/sync-ranking.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: copa-do-mundo-3c309
