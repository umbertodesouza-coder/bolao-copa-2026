name: Artilheiros - Copa 2026
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  scorers:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Sincronizar artilheiros
        run: node scripts/sync-scorers.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: copa-do-mundo-3c309
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_LEAGUE: ${{ secrets.API_FOOTBALL_LEAGUE || '1' }}
          API_FOOTBALL_SEASON: ${{ secrets.API_FOOTBALL_SEASON || '2026' }}
          API_FOOTBALL_LEAGUE:      '1'
          API_FOOTBALL_SEASON:      '2026'
